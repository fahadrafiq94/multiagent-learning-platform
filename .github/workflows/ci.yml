name: Backend CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "features/**"

  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Quality Checks

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy .

      - name: Run pytest
        run: uv run pytest

      - name: Verify FastAPI imports
        run: uv run python -c "from app.main import app; print('FastAPI import successful')"