name: Backend CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "features/**"
      - "feat/**"

  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Quality Checks

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy .

      - name: Run pytest
        run: uv run pytest

      - name: Verify FastAPI imports
        run: uv run python -c "from app.main import app; print('FastAPI import successful')"

      - name: Check exported frontend API contract
        run: uv run python -m scripts.export_frontend_contract --check

      - name: Set up Node for browser contracts
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend development tools
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Check frontend types and client tests
        working-directory: frontend
        run: |
          npm run types
          git diff --exit-code -- generated/api.d.ts
          npm run typecheck
          npm test

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser identity tests
        working-directory: frontend
        run: npm run test:browser

      - name: Retain browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-browser-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
