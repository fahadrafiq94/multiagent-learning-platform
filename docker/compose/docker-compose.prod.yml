services:
  backend:
    build:
      context: ../..
      dockerfile: docker/backend/Dockerfile

    env_file:
      - ../../backend/.env.production

    environment:
      APP_ENV: production
      OLLAMA_BASE_URL: http://ollama:11434
      MODEL_PROVIDER: ollama

    ports:
      - "8000:8000"

    depends_on:
      ollama:
        condition: service_healthy

    networks:
      - fredi-network

    restart: always

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  ollama:
    image: ollama/ollama:latest

    # No host port in production.
    # Backend reaches Ollama through:
    #
    # http://ollama:11434

    volumes:
      - ollama-data:/root/.ollama

    networks:
      - fredi-network

    restart: always

    # NVIDIA GPU acceleration.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"


volumes:
  ollama-data:


networks:
  fredi-network:
    driver: bridge