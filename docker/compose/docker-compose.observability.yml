# Add after the chosen base/application overlays. Opt-in; no model/RAG flags change.
# One backend process writes this rotating stream; use a collector for multi-worker serving.
services:
  backend:
    environment:
      OBSERVABILITY_LOG_FILE: /var/log/fredi/request-events.jsonl
      OBSERVABILITY_LOG_MAX_BYTES: "10485760"
      OBSERVABILITY_LOG_BACKUP_COUNT: "5"
    volumes:
      - request-events:/var/log/fredi

volumes:
  request-events:
